version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: victorysync
      POSTGRES_USER: victorysync
      POSTGRES_PASSWORD: victorysync_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victorysync"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://victorysync:victorysync_dev@db:5432/victorysync
      SESSION_SECRET: change_me_to_a_random_64_char_secret
      PORT: 8080
      NODE_ENV: production
      # Optional OAuth secrets — add yours here or in a .env file
      # GOOGLE_CLIENT_ID: your_google_client_id
      # GOOGLE_CLIENT_SECRET: your_google_client_secret
      # FACEBOOK_APP_ID: your_facebook_app_id
      # FACEBOOK_APP_SECRET: your_facebook_app_secret
      # SLACK_CLIENT_ID: your_slack_client_id
      # SLACK_CLIENT_SECRET: your_slack_client_secret
      # LINKEDIN_CLIENT_ID: your_linkedin_client_id
      # LINKEDIN_CLIENT_SECRET: your_linkedin_client_secret
      # CALENDLY_CLIENT_ID: your_calendly_client_id
      # CALENDLY_CLIENT_SECRET: your_calendly_client_secret
    ports:
      - "8080:8080"

volumes:
  pgdata:
